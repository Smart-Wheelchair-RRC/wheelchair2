glass_reconstructor_node:
  ros__parameters:
    # Topic Names
    sub_topic_raw_depth: "/camera/camera1/aligned_depth_to_color/image_raw"
    sub_topic_raw_rgb: "/camera/camera1/color/image_raw"
    sub_topic_camera_info: "/camera/camera1/aligned_depth_to_color/camera_info"
    sub_topic_silica_depth: "/glass_detection/depth"
    sub_topic_silica_mask: "/glass_detection/mask"
    
    pub_topic_glass_depth: "/glass_aware/depth/image_rect_raw"
    pub_topic_glass_rgb: "/glass_aware/color/image_overlay"
    pub_topic_glass_pc: "/glass_aware/depth/color/points"

    # Processing Tuning
    mask_threshold: 127
    pc_decimation: 4
    anchor_search_radius: 15  # Pixels to dilate for finding frame anchors
    min_anchor_points: 10