# Configuration parameters for wheelchair2_fast_lio package

use_sim_time: false

fast_lio_odometry:
    config_file: "fast_lio_mapping_mid360.yaml" # name of the config file
    config_path: "" # use default path (wheelchair2_fast_lio/config)
    init_frame_required: true
    lidar_inverted: true
    odom_frame_id: "odom"           # Common odometry frame ID
    initial_frame_id: "camera_init" # Initial camera frame ID for the TF broadcaster
    rviz:
        required: false
        config_file: "" # use default config file (dependencies/FAST_LIO_ROS2/rviz/fastlio.rviz)

localization:
    enabled: true
    broadcast_tf: true      # Whether the localization node should broadcast the map to odom TF
    global_frame: "map"     # Global frame ID (map frame) for localization
    # Note: odom_frame_id for localization will use fast_lio_odometry.odom_frame_id

    # IRL map
    # pcd_map_path: "$MAP_DIR/rrc/rrc_lab.pcd"

    # simulation map
    # pcd_map_path: "$MAP_DIR/sim/obstacles_world.pcd"
    
    # Parameters from localization.py
    publish_3d_map: false
    use_map_cropping: true
    map_crop_distance: 30.0

    icp_threshold: 0.8
    icp_max_iterations: 50

topics:
    lidar_cloud: "/livox/lidar"
    fast_lio_odom: "/Odometry"
    initialpose: "/initialpose"
    localization_pose: "/localization_pose"

nav2:
    nav2_params_file: "" # Path to Nav2 parameters file (if use_nav2 is true)
    map_file_path: ""     # Path to the map file for Nav2 (if use_nav2 is true)
    rviz_config_file: ""  # Path to the RViz config file for Nav2 (if use_nav2 is true)
    rviz_required: true   # Whether to launch RViz for Nav2 visualization