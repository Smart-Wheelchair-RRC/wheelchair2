##################### Global planner (SmacPlanner2D)

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      downsample_costmap: false # whether or not to downsample the map
      downsampling_factor: 1 # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      tolerance: 0.75 #5                 # dist-to-goal heuristic cost (distance) for valid tolerance endpoints if exact goal cannot be found.
      allow_unknown: false # allow traveling in unknown space
      max_iterations: 1000000 # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000 # Maximum number of iterations after within tolerances to continue to try to find exact solution
      max_planning_time: 5.0 # max time in s for planner to plan, smooth
      smooth_path: True # If true, does a simple and quick smoothing post-processing to the path

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2 # Whether to recursively run the smoother 3 times on the results from prior runs to refine the results further



####################### Waypoint follower

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    introspection_mode: "disabled"
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200



######################## Collision checker


collision_monitor:
  ros__parameters:
    enabled: False
    use_sim_time: false
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed" 
    cmd_vel_out_topic: "cmd_vel" 
    state_topic: "collision_monitor_state"
    transform_tolerance: 1.0
    source_timeout: 1.0
    stop_pub_timeout: 2.0
    
    # We use two zones: A dynamic braking zone, and a static hard-stop
    polygons: ["DynamicBrakingZone"]
    
    DynamicBrakingZone:
      type: "polygon" # <--- THIS IS THE MAGIC WORD FOR HUMBLE
      action_type: "approach" 
      # Subscribe to the local costmap to get the exact wheelchair shape
      footprint_topic: "/local_costmap/published_footprint"
      
      # 2.5 seconds of look-ahead. 
      # At 0.8 m/s, it starts braking 2 meters away from the closed door.
      # When rotating at 0 m/s forward, this projection mathematically shrinks to 0.
      time_before_collision: 2.5
      simulate_ahead_time: 2.5
      min_points: 6
      enabled: true
      visualize: false # Keep false. Dynamic footprints cause severe RViz flickering.

    HardStopZone:
      type: "polygon"
      action_type: "stop" 
      # The absolute safety bubble. If the dynamic zone slows the robot down to a crawl,
      # this static zone acts as the final "brick wall" so it doesn't touch the door.
      points: [0.75, 0.40, 1.30, 0.40, 1.30, -0.40, 0.75, -0.40]
      visualize: false 
      enabled: true

    observation_sources: ["pointcloud"] 

    pointcloud:
      type: "pointcloud"
      topic: "/points_nonground" 
      min_height: 0.01 
      max_height: 1.7 
      enabled: true