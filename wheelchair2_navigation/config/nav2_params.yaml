    global_frame: odom
    robot_base_frame: base_footprint
    transform_timeout: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.1
    min_rotational_vel: 0.1
    rotational_acc_lim: 0.1

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
