version: '3.8'

services:
  wheelchair_nav:
    container_name: wheelchair_nav
    image: wheelchair2:jetson
    entrypoint: ""
    build:
      context: ..
      dockerfile: .devcontainer/jetson-arm/Dockerfile
    privileged: true
    network_mode: host
    ipc: host
    runtime: nvidia
    cap_add:
      - SYS_NICE
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    user: container_user
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/pts:/dev/pts
      - ..:/home/container_user/wheelchair2/src
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - PULSE_SERVER=${PULSE_SERVER}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=56
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - NVIDIA_DISABLE_REQUIRE=true
    command: tail -f /dev/null
